<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单行实时字幕 - 二遍优化体验Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
  }

  /* 顶部标题栏 */
  .header {
    background: #16213e;
    padding: 16px 24px;
    border-bottom: 1px solid #0f3460;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .subtitle { font-size: 13px; color: #888; margin-top: 4px; }

  /* 主布局 */
  .main {
    display: grid;
    grid-template-columns: 300px 1fr 380px;
    height: calc(100vh - 70px);
  }

  /* 左侧控制面板 */
  .controls {
    background: #16213e;
    padding: 20px;
    border-right: 1px solid #0f3460;
    overflow-y: auto;
  }
  .controls h3 {
    font-size: 14px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .btn-group { margin-bottom: 24px; }
  .btn {
    display: block;
    width: 100%;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    font-weight: 500;
  }
  .btn-primary {
    background: #e94560;
    color: white;
  }
  .btn-primary:hover { background: #ff5577; transform: translateX(4px); }
  .btn-scene {
    background: #0f3460;
    color: #ccc;
  }
  .btn-scene:hover { background: #1a4a8a; color: #fff; }
  .btn-scene.active { background: #e94560; color: #fff; }
  .btn-control {
    background: #533483;
    color: white;
  }
  .btn-control:hover { background: #6b44a8; }

  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 8px;
  }
  .status-active { background: #4caf50; }
  .status-cooling { background: #ff9800; animation: pulse 1s infinite; }
  .status-locked { background: #9e9e9e; }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* 中间：模拟会议区域 */
  .meeting-area {
    position: relative;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  /* 虚拟参会人头像 */
  .participants {
    display: flex;
    gap: 40px;
    margin-bottom: 80px;
  }
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: bold;
    transition: all 0.3s;
    position: relative;
  }
  .avatar.speaking {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(233, 69, 96, 0.6);
  }
  .avatar.speaking::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 3px solid #e94560;
    animation: ripple 1s infinite;
  }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  .avatar-0 { background: linear-gradient(135deg, #667eea, #764ba2); }
  .avatar-1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .avatar-name {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    color: #ccc;
  }
  .avatar-name .speaker-badge-mini {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    margin-left: 4px;
  }

  /* 字幕容器 */
  .caption-container {
    position: absolute;
    bottom: 12vh;
    left: 50%;
    transform: translateX(-50%);
    max-width: 80vw;
    z-index: 100;
  }
  
  /* 上一行字幕（淡出中） */
  .caption-line.previous-line {
    opacity: 0.5;
    font-size: 0.75em;
    transform: translateY(-20px) scale(0.95);
    margin-bottom: 8px;
    transition: all 0.5s ease;
  }

  /* 当前字幕行 */
  .caption-line {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 14px 24px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: clamp(20px, 2.8vw, 32px);
    line-height: 1.5;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition: all 0.3s ease;
    max-width: 100%;
  }
  
  .caption-line.slide-in {
    animation: slideUp 0.3s ease forwards;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 说话人标签 */
  .caption-badge {
    flex-shrink: 0;
    padding: 5px 14px;
    border-radius: 12px;
    font-size: 0.6em;
    font-weight: 700;
    white-space: nowrap;
    transition: all 0.3s ease;
  }
  .caption-badge.badge-update {
    animation: badgePop 0.4s ease;
  }
  @keyframes badgePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* 文本区域 */
  .caption-text-wrapper {
    position: relative;
  }
  .caption-text {
    word-break: break-word;
  }
  .caption-correction {
    background: rgba(255, 235, 59, 0.4);
    border-radius: 4px;
    padding: 0 3px;
    transition: background 0.5s ease;
  }
  .caption-correction.fade-out {
    background: transparent;
  }

  /* 光标 */
  .caption-cursor {
    display: inline-block;
    width: 3px;
    height: 1.2em;
    background: #fff;
    margin-left: 3px;
    vertical-align: text-bottom;
    animation: cursorBlink 1s ease-in-out infinite;
  }
  @keyframes cursorBlink {
    0%, 45% { opacity: 1; }
    50%, 95% { opacity: 0; }
    100% { opacity: 1; }
  }

  /* 右侧：日志面板 */
  .log-panel {
    background: #0d1117;
    border-left: 1px solid #0f3460;
    display: flex;
    flex-direction: column;
  }
  .log-header {
    padding: 16px 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-header h3 {
    font-size: 14px;
    color: #8b949e;
  }
  .log-stats {
    font-size: 11px;
    color: #8b949e;
  }
  .log-stats span { margin-left: 8px; }
  .log-stats .num { color: #58a6ff; font-weight: 600; }

  .log-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    font-size: 11px;
    line-height: 1.6;
  }
  .log-entry {
    padding: 4px 8px;
    border-radius: 4px;
    margin-bottom: 2px;
    display: flex;
    gap: 8px;
  }
  .log-entry:hover { background: #161b22; }
  .log-time { color: #8b949e; flex-shrink: 0; }
  .log-area-debug { color: #8b949e; }
  .log-area-diff { color: #d2a8ff; }
  .log-area-captionmgr { color: #58a6ff; }
  .log-area-test { color: #7ee787; }
  .log-msg { color: #c9d1d9; flex: 1; word-break: break-word; }
  .log-level-INFO .log-msg { color: #7ee787; }
  .log-level-WARN .log-msg { color: #d29922; }
  .log-level-ERROR .log-msg { color: #f85149; }
  .log-level-WARN { background: rgba(210, 153, 34, 0.1); }
  .log-data {
    color: #8b949e;
    font-size: 10px;
    padding-left: 50px;
    padding-bottom: 4px;
  }

  /* 状态指示条 */
  .state-indicator {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 12px;
  }
  .state-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .state-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .state-dot.active { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
  .state-dot.inactive { background: #444; }

  /* 提示文字 */
  .hint {
    position: absolute;
    bottom: 40px;
    left: 20px;
    font-size: 12px;
    color: #666;
    max-width: 260px;
    line-height: 1.6;
  }
  .hint kbd {
    background: #333;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🎙️ 单行实时字幕 Demo</h1>
    <div class="subtitle">验证二遍优化文本更新、说话人绑定、Diff平滑动画</div>
  </div>
  <div id="currentStatus" style="font-size: 13px; color: #888;">
    状态: <span class="status-badge status-locked" id="statusBadge">就绪</span>
  </div>
</div>

<div class="main">
  <!-- 左侧控制 -->
  <div class="controls">
    <h3>演示场景</h3>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="runAllScenarios()">▶️ 依次播放所有场景</button>
    </div>
    
    <h3>单独体验</h3>
    <div class="btn-group">
      <button class="btn btn-scene" data-scene="normal" onclick="runScene('normal')">1️⃣ 正常流畅说话</button>
      <button class="btn btn-scene" data-scene="homophone" onclick="runScene('homophone')">2️⃣ 同音字修正（在→再）</button>
      <button class="btn btn-scene" data-scene="filler" onclick="runScene('filler')">3️⃣ 删除语气词（嗯…）</button>
      <button class="btn btn-scene" data-scene="speaker" onclick="runScene('speaker')">4️⃣ 两人对话切换</button>
      <button class="btn btn-scene" data-scene="voiceprint" onclick="runScene('voiceprint')">5️⃣ 声纹晚到绑定</button>
      <button class="btn btn-scene" data-scene="late" onclick="runScene('late')">6️⃣ 太晚大修正被忽略</button>
      <button class="btn btn-scene" data-scene="punctuation" onclick="runScene('punctuation')">7️⃣ 追加标点+DDC顺滑</button>
    </div>

    <h3>控制</h3>
    <div class="btn-group">
      <button class="btn btn-control" onclick="resetDemo()">🔄 重置</button>
      <button class="btn btn-control" onclick="toggleAutoPlay()" id="autoPlayBtn">⏸️ 暂停自动播放</button>
    </div>

    <h3>状态说明</h3>
    <div style="font-size: 12px; color: #999; line-height: 1.8;">
      <div><span class="status-badge status-active">active</span> 说话中，实时更新</div>
      <div style="margin-top:8px"><span class="status-badge status-cooling">cooling</span> 收到definite，冷却800ms</div>
      <div style="margin-top:8px"><span class="status-badge status-locked">locked</span> 已锁定，不再更改</div>
    </div>

    <div class="hint" style="position: static; margin-top: 24px; border-top: 1px solid #333; padding-top: 16px;">
      💡 <b>体验要点</b>：<br>
      • 注意看文字是不是"逐字追加"的<br>
      • 修正的字会有淡黄色高亮<br>
      • 切换说话人时上一句立即锁定<br>
      • 太晚的大修改会被忽略
    </div>
  </div>

  <!-- 中间会议区 -->
  <div class="meeting-area" id="meetingArea">
    <div class="state-indicator">
      <div class="state-item">
        <span class="state-dot inactive" id="dot0"></span>
        <span id="name0">说话人1</span>
      </div>
      <div class="state-item">
        <span class="state-dot inactive" id="dot1"></span>
        <span id="name1">说话人2</span>
      </div>
    </div>

    <div class="participants">
      <div>
        <div class="avatar avatar-0" id="av0">张</div>
        <div class="avatar-name" id="avname0">说话人1</div>
      </div>
      <div>
        <div class="avatar avatar-1" id="av1">李</div>
        <div class="avatar-name" id="avname1">说话人2</div>
      </div>
    </div>

    <div class="caption-container" id="captionContainer"></div>
  </div>

  <!-- 右侧日志 -->
  <div class="log-panel">
    <div class="log-header">
      <h3>📋 实时日志</h3>
      <div class="log-stats">
        <span>追加:<span class="num" id="statAppend">0</span></span>
        <span>小改:<span class="num" id="statSmall">0</span></span>
        <span>大改:<span class="num" id="statLarge">0</span></span>
        <span>忽略:<span class="num" id="statIgnored">0</span></span>
      </div>
    </div>
    <div class="log-content" id="logContent"></div>
  </div>
</div>

<script>
// ========== 单行字幕管理器（带DOM渲染） ==========

const CAPTION_STATES = { ACTIVE: 'active', COOLING: 'cooling', LOCKED: 'locked' };
const SPEAKER_COLORS = { 0: '#667eea', 1: '#f5576c' };
const SPEAKER_NAMES = { 0: '说话人1', 1: '说话人2' };
const SPEAKER_AVATARS = { 0: '张', 1: '李' };

class SingleLineCaptionDemo {
  constructor() {
    this.current = null;
    this.previous = null;
    this.coolingTimer = null;
    this.revisionCounter = 0;
    this.autoPlay = true;
    this.isRunning = false;
    
    this.stats = {
      pureAppends: 0, smallCorrections: 0,
      largeCorrections: 0, ignoredUpdates: 0, locksOnNewUtt: 0,
    };

    this.speakerNames = { ...SPEAKER_NAMES };
    this.container = document.getElementById('captionContainer');
    this.updateStats();
    this.log('INFO', 'CaptionMgr', '=== 字幕Demo已就绪，点击左侧按钮开始体验 ===');
  }

  log(level, area, msg, data) {
    addLog(level, area, msg, data);
  }

  onUtteranceUpdate(utt) {
    const uttId = `utt_${utt.startTime}`;
    
    this.log('DEBUG', 'CaptionMgr', `收到Utterance`, {
      start: utt.startTime, text: utt.text, definite: utt.definite, speaker: utt.speakerId
    });

    const isNewUtterance = !this.current || utt.startTime !== this.current.startTime;
    const isSpeakerChanged = this.current && utt.speakerId !== this.current.speakerId;

    if (isNewUtterance || isSpeakerChanged) {
      if (isSpeakerChanged && !isNewUtterance) {
        this.log('WARN', 'CaptionMgr', `⚠️ speakerId变化，强制切句`);
      }
      if (this.current) {
        this.log('INFO', 'CaptionMgr', `🔒 锁定当前行（新句子/新说话人）`, {text: this.current.text});
        this.stats.locksOnNewUtt++;
      }
      this._lockCurrent();
      this._pushNewLine(utt);
      this.updateStats();
      this.updateStatusBadge();
      this.updateSpeakingIndicator(utt.speakerId);
      return;
    }

    if (this.current.status === CAPTION_STATES.LOCKED) {
      this.stats.ignoredUpdates++;
      this.log('DEBUG', 'CaptionMgr', `⏭️ 已锁定，忽略更新`);
      this.updateStats();
      return;
    }

    if (utt.definite && this.current.status === CAPTION_STATES.ACTIVE) {
      this.log('INFO', 'CaptionMgr', `✅ 收到definite，进入冷却期（800ms）`, {text: utt.text});
      this.current.status = CAPTION_STATES.COOLING;
      this._startCoolingTimer();
      this.updateStatusBadge();
    }

    const result = this._updateTextSmooth(utt.text);
    
    if (result.type === 'ignored_late_correction') {
      this.log('WARN', 'CaptionMgr', `🚫 大修正太晚，忽略更新`, {
        coolingElapsed: this._getCoolingElapsed(),
        current: this.current.text, ignored: utt.text
      });
      this.stats.ignoredUpdates++;
      this.updateStats();
      return;
    }

    if (utt.speakerInfo && !this.current.speakerInfo) {
      this.current.speakerInfo = utt.speakerInfo;
      this.log('INFO', 'CaptionMgr', `🏷️ 说话人绑定：${utt.speakerInfo.username}`);
      this._applySpeakerInfo(utt.speakerId, utt.speakerInfo);
    }

    this.current.text = utt.text;
    this.current.revision = ++this.revisionCounter;
    this.updateStats();
  }

  _updateTextSmooth(newText) {
    const oldText = this.current.text;
    if (oldText === newText) return { type: 'no_change' };

    let prefixLen = 0;
    const minLen = Math.min(oldText.length, newText.length);
    while (prefixLen < minLen && oldText[prefixLen] === newText[prefixLen]) prefixLen++;

    let suffixLen = 0;
    const maxSuf = Math.min(oldText.length - prefixLen, newText.length - prefixLen);
    while (suffixLen < maxSuf && 
           oldText[oldText.length - 1 - suffixLen] === newText[newText.length - 1 - suffixLen]) suffixLen++;

    const oldMid = oldText.substring(prefixLen, oldText.length - suffixLen);
    const newMid = newText.substring(prefixLen, newText.length - suffixLen);
    const isPureAppend = prefixLen >= oldText.length && suffixLen === 0;

    this.log('DEBUG', 'Diff', `Diff分析`, {
      prefix: prefixLen, suffix: suffixLen,
      oldMid: oldMid || '(empty)', newMid: newMid || '(empty)', isPureAppend
    });

    if (isPureAppend) {
      const added = newText.substring(oldText.length);
      this.stats.pureAppends++;
      this.log('INFO', 'Diff', `➕ 纯追加（打字机效果）`, {append: added});
      this._renderAppend(added);
      return { type: 'pure_append' };
    }

    const isSmall = oldMid.length <= 3 && newMid.length <= 3;
    if (isSmall) {
      this.stats.smallCorrections++;
      this.log('INFO', 'Diff', `🔄 小修正（微高亮）`, {old: oldMid, new: newMid});
      this._renderCorrection(prefixLen, oldMid, newMid, suffixLen, newText);
      return { type: 'small_correction' };
    } else {
      this.stats.largeCorrections++;
      const coolingElapsed = this._getCoolingElapsed();
      const willIgnore = this.current.status === CAPTION_STATES.COOLING && coolingElapsed > 400;
      this.log('WARN', 'Diff', `⚠️ 大修正`, {old: oldMid, new: newMid, willIgnore, elapsed: coolingElapsed});
      if (willIgnore) return { type: 'ignored_late_correction' };
      this._renderFullUpdate(newText);
      return { type: 'large_correction' };
    }
  }

  _renderAppend(text) {
    const textEl = this.current.textEl;
    const cursor = this.current.cursorEl;
    const chars = Array.from(text);
    let i = 0;
    const batchSize = Math.max(1, Math.ceil(chars.length / 6));
    
    const appendNext = () => {
      if (i >= chars.length || !this.current) return;
      const batch = chars.slice(i, i + batchSize).join('');
      const node = document.createTextNode(batch);
      textEl.insertBefore(node, cursor);
      i += batchSize;
      if (i < chars.length) requestAnimationFrame(appendNext);
    };
    requestAnimationFrame(appendNext);
  }

  _renderCorrection(prefixLen, oldMid, newMid, suffixLen, fullText) {
    const textEl = this.current.textEl;
    const cursor = this.current.cursorEl;
    
    // 直接更新全文，但给变化部分加高亮
    const prefix = fullText.substring(0, prefixLen);
    const corrected = newMid;
    const suffix = fullText.substring(prefixLen + newMid.length);
    
    textEl.innerHTML = '';
    textEl.appendChild(document.createTextNode(prefix));
    
    if (corrected) {
      const span = document.createElement('span');
      span.className = 'caption-correction';
      span.textContent = corrected;
      textEl.appendChild(span);
      setTimeout(() => {
        span.classList.add('fade-out');
        setTimeout(() => {
          const t = document.createTextNode(corrected);
          span.parentNode.replaceChild(t, span);
        }, 500);
      }, 200);
    }
    
    textEl.appendChild(document.createTextNode(suffix));
    textEl.appendChild(cursor);
  }

  _renderFullUpdate(newText) {
    const textEl = this.current.textEl;
    const cursor = this.current.cursorEl;
    textEl.style.opacity = '0.4';
    setTimeout(() => {
      if (!this.current) return;
      textEl.innerHTML = '';
      textEl.appendChild(document.createTextNode(newText));
      textEl.appendChild(cursor);
      textEl.style.opacity = '1';
    }, 150);
  }

  _startCoolingTimer() {
    clearTimeout(this.coolingTimer);
    this.current.coolingStartedAt = Date.now();
    this.coolingTimer = setTimeout(() => {
      if (this.current && this.current.status === CAPTION_STATES.COOLING) {
        this.current.status = CAPTION_STATES.LOCKED;
        this.log('INFO', 'CaptionMgr', `🔒 冷却结束，锁定`, {text: this.current.text});
        this._removeCursor();
        this.updateStatusBadge();
      }
    }, 800);
  }

  _getCoolingElapsed() {
    if (!this.current || this.current.status !== CAPTION_STATES.COOLING) return 0;
    return Date.now() - this.current.coolingStartedAt;
  }

  _lockCurrent() {
    if (!this.current) return;
    clearTimeout(this.coolingTimer);
    this.current.status = CAPTION_STATES.LOCKED;
    this._removeCursor();
    
    // 移到previous
    if (this.previous && this.previous.el && this.previous.el.parentNode) {
      this.previous.el.remove();
    }
    this.previous = this.current;
    this.previous.el.classList.add('previous-line');
    this.container.insertBefore(this.previous.el, this.container.firstChild);
    
    setTimeout(() => {
      if (this.previous && this.previous.el && this.previous.el.parentNode) {
        this.previous.el.style.opacity = '0';
        setTimeout(() => {
          if (this.previous && this.previous.el && this.previous.el.parentNode) {
            this.previous.el.remove();
          }
        }, 500);
      }
    }, 2000);
    
    this.current = null;
    this.updateSpeakingIndicator(-1);
  }

  _pushNewLine(utt) {
    this.revisionCounter = 0;
    
    const line = document.createElement('div');
    line.className = 'caption-line slide-in';
    
    const badge = document.createElement('span');
    badge.className = 'caption-badge';
    badge.style.background = SPEAKER_COLORS[utt.speakerId];
    badge.textContent = this.speakerNames[utt.speakerId] || `说话人${utt.speakerId+1}`;
    
    const textWrapper = document.createElement('div');
    textWrapper.className = 'caption-text-wrapper';
    
    const textEl = document.createElement('span');
    textEl.className = 'caption-text';
    
    const cursor = document.createElement('span');
    cursor.className = 'caption-cursor';
    
    textEl.appendChild(document.createTextNode(utt.text));
    textEl.appendChild(cursor);
    textWrapper.appendChild(textEl);
    line.appendChild(badge);
    line.appendChild(textWrapper);
    
    this.container.appendChild(line);

    this.current = {
      uttId: `utt_${utt.startTime}`,
      startTime: utt.startTime,
      speakerId: utt.speakerId,
      text: utt.text,
      speakerInfo: utt.speakerInfo || null,
      status: utt.definite ? CAPTION_STATES.COOLING : CAPTION_STATES.ACTIVE,
      el: line,
      badgeEl: badge,
      textEl: textEl,
      cursorEl: cursor,
      revision: 0,
    };

    if (this.current.status === CAPTION_STATES.COOLING) {
      this._startCoolingTimer();
    }

    this.log('INFO', 'CaptionMgr', `🆕 新行创建`, {text: utt.text, speaker: utt.speakerId});
  }

  _removeCursor() {
    if (this.current && this.current.cursorEl && this.current.cursorEl.parentNode) {
      this.current.cursorEl.remove();
    }
  }

  _applySpeakerInfo(speakerId, info) {
    this.speakerNames[speakerId] = info.username;
    document.getElementById(`name${speakerId}`).textContent = info.username;
    document.getElementById(`avname${speakerId}`).textContent = info.username;
    
    if (this.current && this.current.speakerId === speakerId) {
      this.current.badgeEl.textContent = info.username;
      this.current.badgeEl.style.background = info.color;
      this.current.badgeEl.classList.add('badge-update');
      setTimeout(() => this.current?.badgeEl?.classList.remove('badge-update'), 400);
    }
    if (this.previous && this.previous.speakerId === speakerId && this.previous.badgeEl) {
      this.previous.badgeEl.textContent = info.username;
      this.previous.badgeEl.style.background = info.color;
    }
  }

  onSpeakerMatched(speakerId, info) {
    setTimeout(() => {
      this.log('INFO', 'CaptionMgr', `🏷️ 声纹识别完成：${info.username}（score: ${info.score}）`);
      this._applySpeakerInfo(speakerId, info);
      if (this.current) this.current.speakerInfo = info;
    }, info.delay || 0);
  }

  updateStatusBadge() {
    const badge = document.getElementById('statusBadge');
    if (!this.current) {
      badge.textContent = '就绪';
      badge.className = 'status-badge status-locked';
      return;
    }
    const map = {
      active: ['聆听中...', 'status-active'],
      cooling: ['确认中...', 'status-cooling'],
      locked: ['已锁定', 'status-locked'],
    };
    const [text, cls] = map[this.current.status];
    badge.textContent = text;
    badge.className = `status-badge ${cls}`;
  }

  updateSpeakingIndicator(speakerId) {
    for (let i = 0; i < 2; i++) {
      const av = document.getElementById(`av${i}`);
      const dot = document.getElementById(`dot${i}`);
      av.classList.toggle('speaking', i === speakerId);
      dot.className = `state-dot ${i === speakerId ? 'active' : 'inactive'}`;
    }
  }

  updateStats() {
    document.getElementById('statAppend').textContent = this.stats.pureAppends;
    document.getElementById('statSmall').textContent = this.stats.smallCorrections;
    document.getElementById('statLarge').textContent = this.stats.largeCorrections;
    document.getElementById('statIgnored').textContent = this.stats.ignoredUpdates;
  }

  reset() {
    clearTimeout(this.coolingTimer);
    this.container.innerHTML = '';
    this.current = null;
    this.previous = null;
    this.stats = { pureAppends:0, smallCorrections:0, largeCorrections:0, ignoredUpdates:0, locksOnNewUtt:0 };
    this.speakerNames = { ...SPEAKER_NAMES };
    for (let i = 0; i < 2; i++) {
      document.getElementById(`name${i}`).textContent = SPEAKER_NAMES[i];
      document.getElementById(`avname${i}`).textContent = SPEAKER_NAMES[i];
      document.getElementById(`av${i}`).classList.remove('speaking');
      document.getElementById(`dot${i}`).className = 'state-dot inactive';
    }
    document.getElementById('logContent').innerHTML = '';
    this.updateStats();
    this.updateStatusBadge();
    this.log('INFO', 'Test', '🔄 Demo已重置');
  }
}

// ========== 日志面板 ==========
function addLog(level, area, msg, data) {
  const panel = document.getElementById('logContent');
  const entry = document.createElement('div');
  entry.className = `log-entry log-level-${level}`;
  
  const time = new Date().toISOString().substr(11, 8);
  entry.innerHTML = `
    <span class="log-time">${time}</span>
    <span class="log-area log-area-${area.toLowerCase()}">[${area}]</span>
    <span class="log-msg">${msg}</span>
  `;
  panel.appendChild(entry);
  
  if (data && Object.keys(data).length > 0) {
    const dataEl = document.createElement('div');
    dataEl.className = 'log-data';
    dataEl.textContent = JSON.stringify(data);
    panel.appendChild(dataEl);
  }
  
  panel.scrollTop = panel.scrollHeight;
}

}

async function runScene(name) {
  if (isSceneRunning) return;
  isSceneRunning = true;
  
  document.querySelectorAll('.btn-scene').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`[data-scene="${name}"]`);
  btn?.classList.add('active');
  
  demo.reset();
  await sleep(200);
  
  demo.log('INFO', 'Test', `▶️ 开始场景：${btn?.textContent || name}`);
  try {
    await scenes[name]();
    demo.log('INFO', 'Test', `✅ 场景完成`);
  } catch(e) {
    demo.log('ERROR', 'Test', `场景出错: ${e.message}`);
    console.error(e);
  }
  
  btn?.classList.remove('active');
  isSceneRunning = false;
}

async function runAllScenarios() {
  if (isSceneRunning) return;
  const sceneNames = Object.keys(scenes);
  for (const name of sceneNames) {
    if (!demo.autoPlay) {
      demo.log('WARN', 'Test', '⏸️ 自动播放已暂停');
      break;
    }
    await runScene(name);
    if (demo.autoPlay) await sleep(800);
  }
  demo.log('INFO', 'Test', '🎉 所有场景播放完成！');
}

function resetDemo() {
  demo.reset();
  document.querySelectorAll('.btn-scene').forEach(b => b.classList.remove('active'));
}

function toggleAutoPlay() {
  demo.autoPlay = !demo.autoPlay;
  const btn = document.getElementById('autoPlayBtn');
  btn.textContent = demo.autoPlay ? '⏸️ 暂停自动播放' : '▶️ 继续自动播放';
}
